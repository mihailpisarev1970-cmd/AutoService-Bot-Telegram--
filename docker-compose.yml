services:
  redis:
    image: redis:7-alpine
    container_name: autoservice_redis
    restart: always
    environment:
      TZ: Europe/Moscow

  bot:
    build: .
    container_name: autoservice_bot
    restart: always
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Europe/Moscow
